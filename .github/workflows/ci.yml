name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Audit
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end in real Chromium
    runs-on: ubuntu-latest
    # Separate job because it needs a browser download and a virtual display. It
    # catches the class of problem no unit test can: whether the manifest actually
    # loads, whether the surfaces render, and whether the extension contacts any
    # host it should not — which is the only mechanical check on the zero-telemetry
    # claim.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: extension
      - run: npm run build -w extension
      - run: xvfb-run -a node extension/scripts/e2e.mjs

  privacy-guard:
    name: Privacy guard
    runs-on: ubuntu-latest
    # Deliberately fast and build-free: these assertions are what stop the
    # privacy promise rotting, so they must never be skipped to save time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The Worker must not log
        run: |
          if grep -rn --include='*.ts' 'console\.' worker/src \
             | grep -v '^worker/src/observability/'; then
            echo "::error::console.* outside worker/src/observability/ — the Worker keeps no request log."
            exit 1
          fi

      - name: Client IPs may only be read by the throttle
        run: |
          if grep -rn --include='*.ts' 'CF-Connecting-IP' worker/src \
             | grep -v '^worker/src/security/throttle.ts'; then
            echo "::error::CF-Connecting-IP read outside security/throttle.ts."
            exit 1
          fi

      - name: No secrets committed
        run: |
          if git ls-files --error-unmatch '**/.dev.vars' 2>/dev/null; then
            echo "::error::.dev.vars is tracked by git."
            exit 1
          fi
          if git grep -nE '^\s*CH_API_KEY\s*=\s*.+' -- ':!*.example' ':!.github/**'; then
            echo "::error::A non-empty CH_API_KEY appears in a tracked file."
            exit 1
          fi

      - name: Request logging stays off in every environment
        run: |
          # Wrangler env blocks inherit nothing and Cloudflare's default is ON,
          # so a missing block silently retains request URLs for three days.
          blocks=$(grep -c '"observability"' worker/wrangler.jsonc)
          enabled=$(grep -c '"enabled": false' worker/wrangler.jsonc)
          if [ "$blocks" -ne 3 ] || [ "$enabled" -ne 3 ]; then
            echo "::error::Expected 3 observability blocks all disabled; found $blocks blocks, $enabled disabled."
            exit 1
          fi
          if grep -qE '"(logpush|tail_consumers)"' worker/wrangler.jsonc; then
            echo "::error::logpush or tail_consumers configured — both would create a request log."
            exit 1
          fi
