version: 2

# Grouped deliberately. Ungrouped, Dependabot produces enough pull requests a
# week to get switched off — and it being on is how the `overrides` block and
# the zero-audit rule actually stay true.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
